name: snapvault

# Checks for the companion code. snapvault/.forgejo/workflows/ci.yaml only runs
# when snapvault/ is its own repository root, so this repo-root workflow runs
# the parts that work on Codeberg's hosted runners: formatting, vet, unit
# tests, and the Kustomize image-mapping check. The integration tests need
# Docker, and the image build and promote jobs need cloud credentials; both
# stay in snapvault/'s own pipeline.
on:
  push:
    branches: [main]
    paths:
      - 'snapvault/**'
      - '.forgejo/workflows/snapvault.yaml'
  pull_request:
    paths:
      - 'snapvault/**'
      - '.forgejo/workflows/snapvault.yaml'

jobs:
  check:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    defaults:
      run:
        working-directory: snapvault
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: snapvault/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: Every prod image is mapped
        run: deploy/k8s/check-images.sh
