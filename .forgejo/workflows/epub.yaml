name: epub

# Rebuild Microservices-in-Go.epub and files/book-src.zip whenever the book
# source changes, and commit them back so neither drifts from files/. build.sh
# is reproducible, so this only commits when the book actually changed, and a
# local build with the pinned Pandoc matches CI's byte for byte.
on:
  push:
    branches: [main]
    paths:
      - 'files/**'
      - '!files/book-src.zip' # generated here; committing it shouldn't re-trigger
      - '.forgejo/workflows/epub.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # A repo-scoped token with write access, stored as a secret. Falls
          # back to the token Forgejo issues for the job where that is allowed
          # to push. checkout persists it, so `git push` below just works.
          token: ${{ secrets.EPUB_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Pandoc
        # The distro package is too old, so install the upstream .deb. The
        # version is pinned in files/build.sh; bump it there, deliberately.
        run: |
          PANDOC_VERSION=$(sed -n 's/^PANDOC_VERSION=//p' files/build.sh)
          curl -sSfLO "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          apt-get install -y "./pandoc-${PANDOC_VERSION}-1-amd64.deb"
          rm "pandoc-${PANDOC_VERSION}-1-amd64.deb"

      - name: Build the EPUB and the source bundle
        # build.sh writes next to the sources; the published EPUB lives at the
        # repo root, and book-src.zip stays in files/.
        run: |
          cd files
          ./build.sh
          mv Microservices-in-Go.epub ..

      - name: Commit the rebuilt outputs
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.codeberg.org"
          if git diff --quiet -- Microservices-in-Go.epub files/book-src.zip; then
            echo "EPUB and source bundle unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build: rebuild EPUB from ${GITHUB_SHA::8}" \
            -- Microservices-in-Go.epub files/book-src.zip
          git push origin HEAD:main

      - name: Publish the EPUB as a release
        env:
          TOKEN: ${{ secrets.EPUB_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: latest
        # A single rolling release holds the current EPUB. Forgejo pins a tag
        # when the release is created and will not move it, so replace both.
        run: |
          set -euo pipefail
          auth=(-sS -H "Authorization: token ${TOKEN}")

          id=$(curl "${auth[@]}" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -n "$id" ]; then
            curl "${auth[@]}" -X DELETE "${API}/releases/${id}"
            curl "${auth[@]}" -X DELETE "${API}/tags/${TAG}" || true
          fi

          id=$(curl "${auth[@]}" -X POST "${API}/releases" \
                 -H 'Content-Type: application/json' \
                 -d "$(jq -n --arg tag "$TAG" --arg sha "$(git rev-parse HEAD)" \
                        '{tag_name: $tag,
                          target_commitish: $sha,
                          name: "Microservices in Go — current EPUB",
                          body: ("Built from `" + $sha[0:8] + "`.")}')" \
               | jq -r '.id // empty')
          [ -n "$id" ] || { echo "Could not create release ${TAG}."; exit 1; }

          curl "${auth[@]}" --fail-with-body -X POST \
            -F attachment=@Microservices-in-Go.epub \
            "${API}/releases/${id}/assets?name=Microservices-in-Go.epub" >/dev/null
          echo "Published release ${TAG} (id ${id})."
