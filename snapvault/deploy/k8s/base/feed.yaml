apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed
  labels: { app: feed }
spec:
  replicas: 2
  selector:
    matchLabels: { app: feed }
  template:
    metadata:
      labels: { app: feed }
    spec:
      serviceAccountName: snapvault
      initContainers:
        # Cloud SQL Auth Proxy as a native sidecar (restartPolicy: Always): it
        # starts before the feed container and listens on 127.0.0.1:5432, which
        # is where DATABASE_URL points. The instance connection name is set per
        # environment in the overlay.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --port=5432
            - INSTANCE_CONNECTION_NAME
          securityContext:
            runAsNonRoot: true
          resources:
            requests: { cpu: 100m, memory: 64Mi }
      containers:
        - name: feed
          image: snapvault/feed:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: snapvault-config }
            - secretRef: { name: snapvault-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: feed
spec:
  selector: { app: feed }
  ports:
    - port: 8080
      targetPort: 8080
