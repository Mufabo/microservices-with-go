apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed
  labels: { app: feed }
spec:
  replicas: 2
  selector:
    matchLabels: { app: feed }
  template:
    metadata:
      labels: { app: feed }
    spec:
      serviceAccountName: snapvault
      containers:
        - name: feed
          image: snapvault/feed:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: snapvault-config }
            - secretRef: { name: snapvault-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: feed
spec:
  selector: { app: feed }
  ports:
    - port: 8080
      targetPort: 8080
