apiVersion: v1
kind: ConfigMap
metadata:
  name: snapvault-config
data:
  NATS_URL: "nats://nats:4222"
  STORAGE: "gcs"
  # GCS_BUCKET is set per-environment in the overlay.
  MONGO_DB: "snapvault"
  IMAGES_URL: "http://images:8080"
  METADATA_URL: "http://metadata:8080"
  FEED_URL: "http://feed:8080"
  LOG_LEVEL: "info"
# Secrets (DATABASE_URL, MONGO_URI) are NOT in git or in the cluster. feed and
# metadata mount them from Secret Manager through GKE's Secret Manager add-on
# (overlays/prod/secretproviderclass.yaml) and read them via DATABASE_URL_FILE
# and MONGO_URI_FILE. ../../infra declares the secrets and grants access; their
# values are added out of band (see infra/database.tf and infra/secrets.tf).
