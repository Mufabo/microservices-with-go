apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbnails
  labels: { app: thumbnails }
spec:
  replicas: 1
  selector:
    matchLabels: { app: thumbnails }
  template:
    metadata:
      labels: { app: thumbnails }
    spec:
      serviceAccountName: snapvault
      containers:
        - name: thumbnails
          image: snapvault/thumbnails:latest
          ports:
            - containerPort: 8081   # health only; no Service fronts this worker
          envFrom:
            - configMapRef: { name: snapvault-config }
            - secretRef: { name: snapvault-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 500m, memory: 256Mi }   # image work is CPU-bound
            limits: { memory: 512Mi }
