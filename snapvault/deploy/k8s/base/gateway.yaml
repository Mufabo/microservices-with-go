apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      serviceAccountName: snapvault
      containers:
        - name: gateway
          image: snapvault/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: snapvault-config }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
---
# ClusterIP, not LoadBalancer: the public way in is the HTTPS load balancer
# that the prod overlay's Ingress creates, which terminates TLS with a
# Google-managed certificate. A LoadBalancer Service would also expose plain
# HTTP, and the upload route carries bearer tokens.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    # Route the load balancer straight to Pod IPs (container-native load
    # balancing), using the readiness probe as its health check.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 8080
