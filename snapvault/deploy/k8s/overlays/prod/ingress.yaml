# The public entry point: a global external HTTPS load balancer in front of the
# gateway Service. TLS terminates here with a Google-managed certificate, and
# plain HTTP is redirected to HTTPS, so bearer tokens never cross the internet
# in the clear.
#
# Before this can serve:
#   - reserve the static IP (infra/ingress.tf, output gateway_ip),
#   - point the domain's A record at that IP. It's a DuckDNS subdomain, so
#     set it with DuckDNS's update URL, passing the IP explicitly (otherwise
#     DuckDNS records the address of whatever machine makes the request):
#       curl "https://www.duckdns.org/update?domains=fatihmachtsachen&token=$DUCKDNS_TOKEN&ip=$(terraform -chdir=infra output -raw gateway_ip)"
#     The certificate is issued only once the domain resolves to the load
#     balancer, which can take a while;
#     `kubectl describe managedcertificate gateway` shows its progress.
#   - keep the domain in auth_authorized_domains in terraform.tfvars, so users
#     can sign in from it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: snapvault-gateway-ip
    networking.gke.io/managed-certificates: gateway
    networking.gke.io/v1beta1.FrontendConfig: gateway
spec:
  defaultBackend:
    service:
      name: gateway
      port:
        number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: gateway
spec:
  domains:
    - fatihmachtsachen.duckdns.org
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: gateway
spec:
  redirectToHttps:
    enabled: true
