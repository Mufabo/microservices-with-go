apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: snapvault

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - secretproviderclass.yaml
  - ingress.yaml

# CI updates these tags in the config repo with:
#   kustomize edit set image snapvault/<svc>=<registry>/<svc>:<sha>
# Replace REGION and PROJECT_ID to match your Artifact Registry.
images:
  - name: snapvault/gateway
    newName: REGION-docker.pkg.dev/PROJECT_ID/snapvault/gateway
    newTag: latest
  - name: snapvault/images
    newName: REGION-docker.pkg.dev/PROJECT_ID/snapvault/images
    newTag: latest
  - name: snapvault/thumbnails
    newName: REGION-docker.pkg.dev/PROJECT_ID/snapvault/thumbnails
    newTag: latest
  - name: snapvault/metadata
    newName: REGION-docker.pkg.dev/PROJECT_ID/snapvault/metadata
    newTag: latest
  - name: snapvault/feed
    newName: REGION-docker.pkg.dev/PROJECT_ID/snapvault/feed
    newTag: latest

patches:
  # Environment-specific bucket, and the Identity Platform project whose ID
  # tokens the gateway accepts (the `auth_issuer`/`auth_audience` Terraform
  # outputs). Without these the gateway refuses to start.
  - target: { kind: ConfigMap, name: snapvault-config }
    patch: |-
      - op: add
        path: /data/GCS_BUCKET
        value: snapvault-uploads-prod
      - op: add
        path: /data/AUTH_ISSUER
        value: https://securetoken.google.com/PROJECT_ID
      - op: add
        path: /data/AUTH_AUDIENCE
        value: PROJECT_ID
  # Point the feed's Cloud SQL Auth Proxy at this environment's instance
  # (the `cloudsql_connection_name` Terraform output).
  - target: { kind: Deployment, name: feed }
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/args/1
        value: PROJECT_ID:REGION:snapvault-pg
  # Bind the Kubernetes SA to the Google SA for Workload Identity.
  - target: { kind: ServiceAccount, name: snapvault }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: snapvault@PROJECT_ID.iam.gserviceaccount.com
