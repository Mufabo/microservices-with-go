# Which Secret Manager secrets feed and metadata mount at /secrets, through
# GKE's Secret Manager add-on (enabled in infra/gke.tf). Per environment,
# because the resource names include the project. The Pods read the secrets
# as their own Kubernetes service account, which infra/secrets.tf grants
# access to each one.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: snapvault-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/snapvault-database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/PROJECT_ID/secrets/snapvault-mongo-uri/versions/latest"
        path: "mongo-uri"
