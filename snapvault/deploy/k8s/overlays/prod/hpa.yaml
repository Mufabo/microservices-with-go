apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thumbnails
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: thumbnails
  minReplicas: 1
  maxReplicas: 8
  metrics:
    # Thumbnailing is CPU-bound, so CPU utilization is a good scaling signal.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Alternatively, scale on the JetStream consumer's pending-message count
    # via an external metric. Requires prometheus-nats-exporter (scraped by
    # Managed Prometheus) and the Custom Metrics Stackdriver Adapter; check the
    # metric and label names against the exporter's /metrics output.
    #
    # - type: External
    #   external:
    #     metric:
    #       name: prometheus.googleapis.com|jetstream_consumer_num_pending|gauge
    #       selector:
    #         matchLabels:
    #           metric.labels.consumer_name: thumbnailer
    #     target:
    #       type: AverageValue
    #       averageValue: "30"
